    <!--
      Theme before first paint. Without this the page renders light and then
      snaps to dark, which is worse than having no dark mode at all. Keep the
      key and the attribute in step with src/lib/theme.ts.
    -->
    <script>
      (function () {
        try {
          var root = document.documentElement;

          // THEME: dark on every new visit. A switch to light lasts for this
          // visit only (sessionStorage), so the next visit opens dark again.
          // Not the OS preference: the site looks the same to everyone.
          var saved = sessionStorage.getItem('theme');
          var dark = saved !== 'light';
          root.setAttribute('data-theme', dark ? 'dark' : 'light');
          if (dark) {
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#0A0A0A');
          }

          // LANGUAGE: the document ships lang="en" dir="ltr", so an Arabic url
          // would paint left-to-right for one frame and then flip. The path
          // already says which language this is — "/ar..." is Arabic, anything
          // else is English — so setting it here makes the first frame right.
          // Keep this in step with src/lib/url.ts.
          var ar = location.pathname.split('/').filter(Boolean)[0] === 'ar';
          root.lang = ar ? 'ar' : 'en';
          root.dir = ar ? 'rtl' : 'ltr';
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <!--
      Microsoft Clarity — session recordings and heatmaps.
      Project "mahmoudelzaqla.site", id ym7hoi1r3c. Added 2026-09-22.

      PRODUCTION ONLY. The hostname test is the whole point of writing the
      tag out by hand instead of pasting Clarity's: without it every
      `npm run dev` session and every Vercel preview build lands in the
      recordings, and the heatmaps stop being real visitors. It matches the
      live domain and its subdomains, nothing else.

      The tag is Clarity's own loader with one change: it is injected once the
      page has loaded and the browser is idle (or after 4 seconds at the latest),
      not while the page is still being parsed. The recording script and its
      requests then never compete with the first paint, the hero image or the
      app bundle. `window.clarity` exists at once, so the nudge's events queue
      and are sent when the tag arrives. The hash of this script is in the CSP
      in vercel.json: if you change one character here, recompute it there.
      Clarity masks text content by
      default and this page has no inputs to leak, so no extra masking rules
      are needed here — masking is configured in the Clarity dashboard.
    -->
    <script>
      (function (c, l, a, r, i, t, y) {
        if (!/(^|\.)mahmoudelzaqla\.site$/.test(l.location.hostname)) return;
        c[a] =
          c[a] ||
          function () {
            (c[a].q = c[a].q || []).push(arguments);
          };
        var load = function () {
          t = l.createElement(r);
          t.async = 1;
          t.src = 'https://www.clarity.ms/tag/' + i;
          y = l.getElementsByTagName(r)[0];
          y.parentNode.insertBefore(t, y);
        };
        var idle = function () {
          (c.requestIdleCallback || function (f) { setTimeout(f, 1); })(load, { timeout: 4000 });
        };
        if (l.readyState === 'complete') idle();
        else c.addEventListener('load', idle, { once: true });
      })(window, document, 'clarity', 'script', 'ym7hoi1r3c');
    </script>

    <!-- The name in the hero is set in this face, so it is self-hosted and
         fetched first: no third-party round trip, and the name never falls
         back to a wide Arial that would run across his face. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/archivo-latin.woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Only the weights this page asks for. Fetched as `print` and flipped to
      `all` on load, so the round trip to Google never holds up first paint —
      safe because every face is display=swap.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      media="print"
      id="fontcss"
    />
    <!--
      THE SWAP, MOVED OUT OF AN onload ATTRIBUTE.

      This was `onload="this.media='all'"` on the link above. An inline
      event handler is not covered by a CSP script hash — only by
      'unsafe-hashes', which weakens the policy for every handler on the
      page — so under the CSP in vercel.json the attribute was blocked and
      the stylesheet stayed at media="print". Fonts silently never loaded.
      Here it is a hashed inline script instead, which the policy allows
      and which does exactly the same thing.
    -->
    <script>
      (function () {
        var f = document.getElementById('fontcss');
        if (!f) return;
        var swap = function () {
          f.media = 'all';
        };
        if (f.sheet) swap();
        else f.addEventListener('load', swap, { once: true });
      })();
    </script>
