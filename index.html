<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />

    <title>Mahmoud Atef — E-commerce Growth Specialist</title>
    <meta
      name="description"
      content="I build Shopify stores, run Meta and TikTok ads, and read the product, the market, the customer, the operation and the numbers before I read the ad."
    />
    <link rel="canonical" href="https://mahmoudelzaqla.site/" />
    <link rel="alternate" hreflang="en" href="https://mahmoudelzaqla.site/" />
    <link rel="alternate" hreflang="ar" href="https://mahmoudelzaqla.site/ar" />
    <link rel="alternate" hreflang="x-default" href="https://mahmoudelzaqla.site/" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      THE SHARING CARD, AND IT DESCRIBES THE ENGLISH ROOT.

      This page is opened from an Instagram bio and shared on WhatsApp, and
      neither scraper runs JavaScript — so the card comes from these tags and
      nowhere else. src/App.tsx rewrites them per route for a real browser,
      but a scraper only ever sees what is written here, which is why "/" has
      to be one fixed language: the tags below and the page a person lands on
      are then the same page.

      Absolute url because LinkedIn needs one; png because WhatsApp does not
      reliably render webp in a card.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mahmoud Atef" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_EG" />
    <meta property="og:url" content="https://mahmoudelzaqla.site/" />
    <meta property="og:title" content="Mahmoud Atef — E-commerce Growth Specialist" />
    <meta
      property="og:description"
      content="I build Shopify stores, run Meta and TikTok ads, and read the product, the market, the customer, the operation and the numbers before I read the ad."
    />
    <meta property="og:image" content="https://mahmoudelzaqla.site/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Theme before first paint. Without this the page renders light and then
      snaps to dark, which is worse than having no dark mode at all. Keep the
      key and the attribute in step with src/lib/theme.ts.
    -->
    <script>
      (function () {
        try {
          var root = document.documentElement;

          // THEME: dark unless a choice was saved. Not the OS preference —
          // the site should look the same to everyone who has not chosen.
          var saved = localStorage.getItem('theme');
          var dark = saved !== 'light';
          root.setAttribute('data-theme', dark ? 'dark' : 'light');
          if (dark) {
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#0F0F0F');
          }

          // LANGUAGE: the document ships lang="en" dir="ltr", so an Arabic url
          // would paint left-to-right for one frame and then flip. The path
          // already says which language this is — "/ar..." is Arabic, anything
          // else is English — so setting it here makes the first frame right.
          // Keep this in step with src/lib/url.ts.
          var ar = location.pathname.split('/').filter(Boolean)[0] === 'ar';
          root.lang = ar ? 'ar' : 'en';
          root.dir = ar ? 'rtl' : 'ltr';
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Only the weights this page asks for. Fetched as `print` and flipped to
      `all` on load, so the round trip to Google never holds up first paint —
      safe because every face is display=swap.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <!-- The portrait is the LCP element, so it is fetched before the bundle
         asks for it. -->
    <link rel="preload" as="image" href="/img/hero-mobile.webp" media="(max-width: 1023px)" />
    <link rel="preload" as="image" href="/img/hero-desktop.webp" media="(min-width: 1024px)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
