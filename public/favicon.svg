<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MZ">
  <!--
    The MZ monogram in near-black on the brand lime, token c-orange =
    204 255 0 on the dark theme.

    Solid tile rather than lime letters on transparent: a favicon is 16px in
    a tab strip, and at that size a filled shape is what the eye finds. And
    the tile is what makes the lime work at all — #CCFF00 letters on a light
    browser strip would be 1.1:1 and disappear. Near-black on it is 16.9:1,
    on either strip.
  -->
  <rect width="64" height="64" rx="14" fill="#CCFF00" />
  <path fill="#0A0A0A" d="M12 44V20h6.2l7.1 12.4L32.4 20h6.2v24h-5.5V29.8l-5.6 9.7h-2.4l-5.6-9.7V44H12z" />
  <path fill="#0A0A0A" d="M40.5 44v-4.3l9.1-14.4h-8.8V20h16v4.3l-9.1 14.4h9.3V44H40.5z" />
</svg>
